name: Build and Deploy to Github Pages

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.4.0

      - name: Install
        run: npm i

      - name: Deploy
        run: ng deploy --project @kris701/ez-ui-demo
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

